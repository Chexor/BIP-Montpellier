<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dosette — Live Demonstration Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
  <main class="stage">

    <!-- ============ PANEL A — physical unit (device app) ============ -->
    <section class="panel panel-a" aria-label="Physical dispenser unit">
      <span class="tag tag-corner">A</span>
      <span class="device-pill pill-device">Dosi · physical unit</span>
      <div class="frame-wrap frame-a">
        <iframe id="fr-device" title="Dosette device display" src="index.html?demoEmbed=1" loading="eager"></iframe>
      </div>
    </section>

    <!-- ============ PANEL D — John's phone (patient app) ============ -->
    <section class="panel panel-d" aria-label="John's phone">
      <span class="tag tag-corner">D</span>
      <div class="panel-top-controls">
        <span class="device-pill pill-patient">John's phone</span>
        <button class="btn-panel-lock" id="btn-lock-patient" title="Lock phone to view push notifications on lockscreen">
          <span class="lock-icon">🔒</span> <span class="lock-text">Lockscreen</span>
        </button>
      </div>
      <div class="frame-wrap frame-tall">
        <iframe id="fr-patient" title="Patient app — John" src="index.html?demoEmbed=1" loading="eager"></iframe>
      </div>
    </section>

    <!-- ============ PANEL E — Sophie's app (caregiver app) ============ -->
    <section class="panel panel-e" aria-label="Sophie's app">
      <span class="tag tag-corner">E</span>
      <div class="panel-top-controls">
        <span class="device-pill pill-caregiver">Sophie's app</span>
        <button class="btn-panel-lock" id="btn-lock-caregiver" title="Lock phone to view caregiver alerts on lockscreen">
          <span class="lock-icon">🔒</span> <span class="lock-text">Lockscreen</span>
        </button>
      </div>
      <div class="frame-wrap frame-tall">
        <iframe id="fr-caregiver" title="Caregiver app — Sophie" src="index.html?demoEmbed=1" loading="eager"></iframe>
      </div>
    </section>

    <!-- ============ PANEL C — walkthrough controls ============ -->
    <section class="panel panel-c" aria-label="Presentation controls">
      <div class="c-head">
        <div class="wt-tabs" id="wt-tabs">
          <span class="tag">C</span>
          <button class="wt-tab is-active" data-wt="load">① Load medicine</button>
          <button class="wt-tab" data-wt="dispense">② Dispense &amp; take</button>
          <button class="wt-tab" data-wt="missed">③ Missed dose</button>
        </div>
        <div class="demo-voice-controls" aria-label="Dosi voice controls">
          <button class="btn-voice" id="btn-demo-voice-toggle" type="button" aria-pressed="true">Dosi voice on</button>
          <button class="btn-voice" id="btn-demo-voice-replay" type="button">Replay voice</button>
          <button class="btn-reset" id="btn-reset">Reset demo</button>
        </div>
      </div>

      <div class="c-groups">
        <div class="c-group c-group--steps">
          <h4 class="c-group-title" id="wt-title">Caregiver loads a medicine</h4>
          <div class="c-btn-grid c-btn-grid--steps" id="wt-steps"><!-- injected --></div>
        </div>

        <div class="c-group">
          <h4 class="c-group-title">Simulation time</h4>
          <div class="c-btn-grid c-btn-grid--time" id="grp-time">
            <button class="c-btn" data-time="08:00">08:00 · Morning</button>
            <button class="c-btn" data-time="12:30">12:30 · Lunch</button>
            <button class="c-btn" data-time="19:00">19:00 · Evening</button>
            <button class="c-btn" data-time="19:10">19:10 · +10 min</button>
            <button class="c-btn c-btn--warn" data-time="19:35">19:35 · Missed</button>
          </div>
        </div>

        <div class="c-group">
          <h4 class="c-group-title">Lockscreen</h4>
          <div class="c-btn-grid c-btn-grid--one" id="grp-lockscreen">
            <button class="c-btn" id="btn-ctl-lock-patient" data-action="lock-patient">🔒 Lock John's phone</button>
            <button class="c-btn" id="btn-ctl-lock-cg" data-action="lock-caregiver">🔒 Lock Sophie's phone</button>
            <button class="c-btn" id="btn-ctl-unlock-all" data-action="unlock-all">🔓 Unlock all phones</button>
          </div>
        </div>

        <div class="c-group">
          <h4 class="c-group-title">Jump to a view</h4>
          <div class="c-btn-grid c-btn-grid--one" id="grp-jump">
            <button class="c-btn" data-jump="patient">Focus John's phone</button>
            <button class="c-btn" data-jump="caregiver">Focus Sophie's app</button>
            <button class="c-btn" data-jump="device">Focus the unit</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="demo.js"></script>
</body>
</html>
